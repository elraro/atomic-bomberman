name: build

# Builds the modern game for Linux, Windows, macOS and Android and runs the unit tests.
# Linux and Windows are built for x86-64 and for 64-bit ARM, each on a runner of that
# processor type, so the tests run on the processor the package is for. The macOS
# package is a universal build (Apple silicon and Intel in one file).
# The artifacts contain only new code: no original game files are in this
# repository, and none are packaged. Players import their own copy with
# `atomic --import-assets` (see INSTALL.md).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools and SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAB_FETCH_SDL3=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p package/atomic-bomberman-modern
          cp build/atomic build/atomic_server README.md INSTALL.md LICENSE package/atomic-bomberman-modern/
          tar -C package -czf atomic-bomberman-modern-linux-${{ matrix.arch }}.tar.gz atomic-bomberman-modern
          # The dedicated network server on its own: no window, no SDL.
          mkdir -p package/atomic-bomberman-server
          cp build/atomic_server README.md INSTALL.md LICENSE package/atomic-bomberman-server/
          tar -C package -czf atomic-bomberman-server-linux-${{ matrix.arch }}.tar.gz atomic-bomberman-server

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-modern-linux-${{ matrix.arch }}
          path: atomic-bomberman-modern-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-server-linux-${{ matrix.arch }}
          path: atomic-bomberman-server-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            platform: x64
          - arch: arm64
            runner: windows-11-arm
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }} -DAB_FETCH_SDL3=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/atomic-bomberman-modern | Out-Null
          Copy-Item build/Release/atomic.exe, build/Release/atomic_server.exe, README.md, INSTALL.md, LICENSE package/atomic-bomberman-modern/
          Compress-Archive -Path package/atomic-bomberman-modern -DestinationPath atomic-bomberman-modern-windows-${{ matrix.arch }}.zip
          # The dedicated network server on its own: no window, no SDL.
          New-Item -ItemType Directory -Force package/atomic-bomberman-server | Out-Null
          Copy-Item build/Release/atomic_server.exe, README.md, INSTALL.md, LICENSE package/atomic-bomberman-server/
          Compress-Archive -Path package/atomic-bomberman-server -DestinationPath atomic-bomberman-server-windows-${{ matrix.arch }}.zip

      - name: Check that the server starts
        shell: pwsh
        run: |
          package/atomic-bomberman-server/atomic_server.exe --help
          "quit" | package/atomic-bomberman-server/atomic_server.exe --port 27411 --hidden

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-modern-windows-${{ matrix.arch }}
          path: atomic-bomberman-modern-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-server-windows-${{ matrix.arch }}
          path: atomic-bomberman-server-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  macos:
    # One package for Apple silicon and Intel Macs. The tests run on the runner's own
    # processor (Apple silicon); the Intel half is built and checked to be present, not run.
    # The programs are not signed with an Apple developer certificate: see INSTALL.md.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAB_FETCH_SDL3=ON
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Failed checks are also shown as annotations on the run's page, which can be
        # read without signing in (the full log cannot).
        run: |
          set -o pipefail
          if ! ctest --test-dir build --output-on-failure | tee test.log; then
            grep -E "FAIL|\*\*\*|Exception|Timeout" test.log | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Check that both processor types are in the programs
        run: |
          for program in build/atomic build/atomic_server; do
            lipo -archs "$program"
            lipo "$program" -verify_arch arm64 x86_64
          done
          otool -L build/atomic

      - name: Package
        run: |
          mkdir -p package/atomic-bomberman-modern
          cp build/atomic build/atomic_server README.md INSTALL.md LICENSE package/atomic-bomberman-modern/
          tar -C package -czf atomic-bomberman-modern-macos-universal.tar.gz atomic-bomberman-modern
          # The dedicated network server on its own: no window, no SDL.
          mkdir -p package/atomic-bomberman-server
          cp build/atomic_server README.md INSTALL.md LICENSE package/atomic-bomberman-server/
          tar -C package -czf atomic-bomberman-server-macos-universal.tar.gz atomic-bomberman-server

      - name: Check that the programs start
        run: |
          package/atomic-bomberman-modern/atomic --version
          package/atomic-bomberman-server/atomic_server --help
          echo quit | package/atomic-bomberman-server/atomic_server --port 27411 --hidden

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-modern-macos-universal
          path: atomic-bomberman-modern-macos-universal.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-server-macos-universal
          path: atomic-bomberman-server-macos-universal.tar.gz
          if-no-files-found: error

  android:
    # The Android app: the same game built with the NDK, wrapped by the project in android/.
    # The APK is signed with a throw-away debug key: it installs, but a later build will not
    # install over it (uninstall first), and it is not for an app store.
    runs-on: ubuntu-24.04
    env:
      GRADLE_VERSION: 8.11.1
    steps:
      - uses: actions/checkout@v7

      - name: Java 21 and the Android SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Gradle
        run: |
          curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: SDL
        run: android/fetch-sdl.sh

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk atomic-bomberman-modern-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: atomic-bomberman-modern-android
          path: atomic-bomberman-modern-android.apk
          if-no-files-found: error

  release:
    # On a version tag (v*), attach the packages to a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            atomic-bomberman-modern-linux-x86_64.tar.gz
            atomic-bomberman-modern-linux-arm64.tar.gz
            atomic-bomberman-modern-windows-x64.zip
            atomic-bomberman-modern-windows-arm64.zip
            atomic-bomberman-modern-macos-universal.tar.gz
            atomic-bomberman-server-linux-x86_64.tar.gz
            atomic-bomberman-server-linux-arm64.tar.gz
            atomic-bomberman-server-windows-x64.zip
            atomic-bomberman-server-windows-arm64.zip
            atomic-bomberman-server-macos-universal.tar.gz
            atomic-bomberman-modern-android.apk
